<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Send files, notes and tasks between your devices instantly." />

    <!-- Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="faax" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="application-name" content="faax" />

    <title>faax · your devices and your people, in one room</title>

    <!-- A single generated app (faax.me/<alias>/a/<appId>) installs on its own: own manifest, name and icon -->
    <script>
      (function () {
        var m = location.pathname.match(/^\/([a-z0-9-]{3,20})\/a\/(app_[a-z0-9]{4,40})\/?$/i);
        if (!m) return;
        var q = new URLSearchParams(location.search);
        var p = new URLSearchParams({ alias: m[1].toLowerCase(), app: m[2], n: q.get("n") || "", g: q.get("g") || "", bg: q.get("bg") || "", fg: q.get("fg") || "" });
        var name = (q.get("n") || "faax app").slice(0, 30);
        var set = function (sel, attr, val) { var el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
        set('link[rel="manifest"]', "href", "/api/app-manifest?" + p);
        set('link[rel="apple-touch-icon"]', "href", "/api/app-icon?" + p);
        set('meta[name="apple-mobile-web-app-title"]', "content", name);
        set('meta[name="application-name"]', "content", name);
        if (/^[0-9a-f]{6}$/i.test(q.get("bg") || "")) set('meta[name="theme-color"]', "content", "#" + q.get("bg"));
        document.title = name;
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
